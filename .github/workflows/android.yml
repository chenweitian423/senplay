name: Android APK

on:
  workflow_dispatch:
    inputs:
      create_release:
        description: "创建 Release 并附加 APK"
        type: boolean
        default: true
      notes:
        description: "更新说明"
        type: string
        default: "首个构建：URL Scheme / WebDAV / Emby / 本地播放 / 断点续播"
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"

permissions:
  contents: write

env:
  EXPECTED_CERT_SHA256: "52b84a9da5335df7d607b9c70dcd0a7623d4d1c7d2911f32c05d0b67906d9efc"

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-35 build-tools;35.0.0"
          accept-android-sdk-licenses: true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Read version
        id: version
        working-directory: android
        run: |
          set -euo pipefail
          NAME=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts | head -n1)
          CODE=$(sed -n 's/.*versionCode = \([0-9][0-9]*\).*/\1/p' app/build.gradle.kts | head -n1)
          [ -n "$NAME" ] && [ -n "$CODE" ] || { echo "::error::版本号解析失败"; exit 1; }
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "Android v$NAME ($CODE)"

      - name: Restore keystore
        env:
          KS_B64: ${{ secrets.APP_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          [ -n "${KS_B64:-}" ] || { echo "::error::缺少 secret APP_KEYSTORE_BASE64"; exit 1; }
          printf '%s' "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.p12"
          test -s "$RUNNER_TEMP/release.p12"
          echo "APP_KEYSTORE=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"

      - name: Build release APK
        working-directory: android
        env:
          APP_KEYSTORE_PASSWORD: ${{ secrets.APP_KEYSTORE_PASSWORD }}
          APP_KEY_ALIAS: ${{ secrets.APP_KEY_ALIAS }}
          APP_KEY_PASSWORD: ${{ secrets.APP_KEY_PASSWORD }}
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Verify signature
        run: |
          set -euo pipefail
          APK=$(find android/app/build/outputs/apk/release -maxdepth 1 -name '*.apk' ! -name '*unsigned*' | head -n1)
          [ -n "$APK" ] || { echo "::error::未找到 APK"; exit 1; }
          APKSIGNER="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n1)/apksigner"
          OUT=$("$APKSIGNER" verify --verbose --print-certs "$APK" 2>&1); printf '%s\n' "$OUT"
          CERT=$(printf '%s\n' "$OUT" | grep -oE 'certificate SHA-256 digest: [0-9a-fA-F]{64}' | head -n1 | awk '{print $NF}' | tr 'A-F' 'a-f' || true)
          EXP=$(printf '%s' "$EXPECTED_CERT_SHA256" | tr 'A-F' 'a-f')
          [ "$CERT" = "$EXP" ] || { echo "::error::签名证书不一致，老用户将无法覆盖升级 (期望 $EXP 实际 ${CERT:-解析失败})"; exit 1; }
          echo "APK=$APK" >> "$GITHUB_ENV"

      - name: Stage artifacts
        env:
          VERSION_NAME: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
          NOTES: ${{ inputs.notes }}
        run: |
          set -euo pipefail
          mkdir -p dist
          APKNAME="senplay-$VERSION_NAME-release.apk"
          cp "$APK" "dist/$APKNAME"
          SHA=$(sha256sum "dist/$APKNAME" | awk '{print $1}')
          SIZE=$(wc -c < "dist/$APKNAME" | tr -d ' ')
          printf '%s' "$SHA" > "dist/$APKNAME.sha256"
          python3 -c "import json,sys;print(json.dumps({'versionCode':int(sys.argv[1]),'versionName':sys.argv[2],'sha256':sys.argv[3],'size':int(sys.argv[4]),'notes':sys.argv[5],'apkName':sys.argv[6]},ensure_ascii=False,indent=2))" "$VERSION_CODE" "$VERSION_NAME" "$SHA" "$SIZE" "$NOTES" "$APKNAME" > dist/update.json
          cat dist/update.json

      - uses: actions/upload-artifact@v4
        with:
          name: senplay-android
          path: dist/*

      - name: Create release
        if: (github.event_name == 'workflow_dispatch' && inputs.create_release) || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v${{ steps.version.outputs.name }}
          name: SenPlay Android ${{ steps.version.outputs.name }}
          body: ${{ inputs.notes }}
          files: dist/*
