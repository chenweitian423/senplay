name: iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"

permissions:
  contents: write

jobs:
  ios:
    # macos-26 carries the Xcode 26 toolchain; the older image's Swift 6.0 front end
    # rejects part of the KSPlayer 2.3.4 graph that this project builds against.
    runs-on: macos-26
    # The KSPlayer + FFmpegKit graph adds roughly twelve minutes of first-build time.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        working-directory: ios
        run: |
          set -euo pipefail
          xcodegen generate
          xcodebuild -list -project SenPlay.xcodeproj

      - name: Build unsigned app
        working-directory: ios
        run: |
          # Both pipefail and errexit would abort before the diagnostics branch runs,
          # so both are turned off and the exit code is captured by hand.
          set +o pipefail
          set +e
          xcodebuild -project SenPlay.xcodeproj -scheme SenPlay -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" CODE_SIGN_ENTITLEMENTS="" \
            build > xcodebuild.log 2>&1
          status=$?
          if [ "$status" -eq 0 ]; then
            tail -n 20 xcodebuild.log
            exit 0
          fi

          echo "=== tail ==="
          tail -n 60 xcodebuild.log || true
          grep -E "error:" xcodebuild.log > errors.txt || true
          echo "=== errors ($(wc -l < errors.txt)) ==="
          head -n 25 errors.txt || true

          if [ -s errors.txt ]; then
            head -n 6 errors.txt | while IFS= read -r line; do
              echo "::error title=build::$line"
            done
          else
            tail -n 2 xcodebuild.log | tr '\n' ' ' | cut -c1-500 | while IFS= read -r line; do
              echo "::error title=build-tail::$line"
            done
            echo "::error title=build-meta::exit $status, $(wc -l < xcodebuild.log) log lines, $(wc -c < xcodebuild.log) bytes"
          fi
          exit "$status"

      - name: Package IPA
        working-directory: ios
        run: |
          set -euo pipefail
          APP=$(find build/Build/Products -maxdepth 2 -name 'SenPlay.app' -type d | head -n1)
          [ -n "$APP" ] || { echo "::error::未找到 .app"; exit 1; }
          V=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$APP/Info.plist")
          BID=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP/Info.plist")
          [ "$BID" = "com.senplay.player" ] || { echo "::error::Bundle ID 异常: $BID"; exit 1; }
          mkdir -p Payload artifacts
          cp -R "$APP" Payload/SenPlay.app
          rm -rf Payload/SenPlay.app/_CodeSignature
          zip -qry "artifacts/SenPlay-$V-unsigned.ipa" Payload
          ls -la artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: senplay-ios-unsigned
          path: ios/artifacts/*

      - name: Create release
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ios-unsigned
          name: SenPlay iOS unsigned IPA
          body: "未签名 IPA，需要用 AltStore / Sideloadly / TrollStore 自行签名后安装。"
          files: ios/artifacts/*
