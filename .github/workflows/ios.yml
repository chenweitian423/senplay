name: iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"

permissions:
  contents: write

jobs:
  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        working-directory: ios
        run: |
          set -euo pipefail
          xcodegen generate
          xcodebuild -list -project SenPlay.xcodeproj

      - name: Build unsigned app
        working-directory: ios
        run: |
          set -euo pipefail
          xcodebuild -project SenPlay.xcodeproj -scheme SenPlay -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" CODE_SIGN_ENTITLEMENTS="" build

      - name: Package IPA
        working-directory: ios
        run: |
          set -euo pipefail
          APP=$(find build/Build/Products -maxdepth 2 -name 'SenPlay.app' -type d | head -n1)
          [ -n "$APP" ] || { echo "::error::未找到 .app"; exit 1; }
          V=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$APP/Info.plist")
          BID=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP/Info.plist")
          [ "$BID" = "com.senplay.player" ] || { echo "::error::Bundle ID 异常: $BID"; exit 1; }
          mkdir -p Payload artifacts
          cp -R "$APP" Payload/SenPlay.app
          rm -rf Payload/SenPlay.app/_CodeSignature
          zip -qry "artifacts/SenPlay-$V-unsigned.ipa" Payload
          ls -la artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: senplay-ios-unsigned
          path: ios/artifacts/*

      - name: Create release
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ios-unsigned
          name: SenPlay iOS unsigned IPA
          body: "未签名 IPA，需要用 AltStore / Sideloadly / TrollStore 自行签名后安装。"
          files: ios/artifacts/*
