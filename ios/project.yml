name: SenPlay
options:
  bundleIdPrefix: com.senplay
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

packages:
  KSPlayer:
    url: https://github.com/kingslay/KSPlayer
    from: "2.3.4"

settings:
  base:
    MARKETING_VERSION: "1.5.0"
    CURRENT_PROJECT_VERSION: "7"
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "15.0"

targets:
  SenPlay:
    type: application
    platform: iOS
    sources:
      - path: SenPlay
    dependencies:
      - package: KSPlayer
        product: KSPlayer
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.senplay.player
        PRODUCT_NAME: SenPlay
        GENERATE_INFOPLIST_FILE: "NO"
        INFOPLIST_FILE: SenPlay/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGNING_ALLOWED: "NO"
        ENABLE_BITCODE: "NO"

  SenPlayTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SenPlayTests
    dependencies:
      - target: SenPlay
    settings:
      base:
        # Deliberately not PRODUCT_NAME: SenPlay — sharing the name with the app
        # makes both targets emit a module called SenPlay and the build stops with
        # "Multiple commands produce ... SenPlay.swiftmodule".
        PRODUCT_BUNDLE_IDENTIFIER: com.senplay.player.tests
        GENERATE_INFOPLIST_FILE: "YES"
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGNING_ALLOWED: "NO"
