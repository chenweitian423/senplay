name: SenPlay
options:
  bundleIdPrefix: com.senplay
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "15.0"

targets:
  SenPlay:
    type: application
    platform: iOS
    sources:
      - path: SenPlay
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.senplay.player
        PRODUCT_NAME: SenPlay
        GENERATE_INFOPLIST_FILE: "NO"
        INFOPLIST_FILE: SenPlay/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGNING_ALLOWED: "NO"
        ENABLE_BITCODE: "NO"
